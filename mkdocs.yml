site_name: Hearth & Herald
site_description: Player documentation for the Hearth & Herald Bannerlord mod.
site_url: https://devoidaxis.github.io/hearth-herald-wiki/
repo_url: https://github.com/DevoidAxis/hearth-herald-wiki
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.action.edit
    - search.suggest

extra:
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - The Clan Home & Offices: clan-home-and-offices.md
  - Ennoblement & Commissions: ennoblement-and-commissions.md
  - Field Clan Building: field-clan-building.md
  - Settings Reference: settings-reference.md
  - Compatibility: compatibility.md
  - FAQ & Troubleshooting: faq.md
  - Translations: translations.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
